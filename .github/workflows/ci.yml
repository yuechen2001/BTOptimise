name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    build-backend:
        name: Build Backend
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 25
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Type check
              working-directory: backend
              run: npx tsc --noEmit

            - name: Build
              working-directory: backend
              run: npm run build

    build-frontend:
        name: Build Frontend
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 25
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Type check
              working-directory: frontend
              run: pnpm exec tsc --noEmit

            - name: Build
              working-directory: frontend
              run: pnpm run build

    test-backend:
        name: Test Backend
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 25
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Run tests
              working-directory: backend
              run: npm test
